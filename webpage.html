<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Engine - Input Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      .brand-green { background-color: #005239; }
      .brand-green-text { color: #006633; }
      .accent-gold-bar { background-color: #FFCC33; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

    <header class="brand-green text-white shadow-md">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <svg class="w-6 h-6 cursor-pointer" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span class="font-semibold tracking-wide">Evidence Engine</span>
            </div>
            <svg class="w-6 h-6 cursor-pointer" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border-2 border-gray-800 w-full max-w-2xl shadow-xl rounded-sm p-8 md:p-12 relative">
            
            <div class="flex items-center space-x-3 border-b-2 border-gray-800 pb-4 mb-8">
                <div class="w-2.5 h-8 accent-gold-bar"></div>
                <h1 class="text-2xl md:text-3xl font-black uppercase tracking-wider brand-green-text">Evidence Engine</h1>
            </div>

            <div class="flex justify-end mb-4">
                </button>
            </div>

            <form id="evidenceForm" class="space-y-6">
                <div>
                    <label for="thesis" class="block text-sm font-bold uppercase tracking-wide text-gray-900 mb-2">
                        THESIS:
                    </label>
                    <input 
                        type="text" 
                        id="thesis" 
                        name="thesis" 
                        placeholder="Enter your paper's main thesis..."
                        class="w-full border-2 border-gray-800 px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-white"
                    >
                </div>

                <div>
                    <label for="reason" class="block text-sm font-bold uppercase tracking-wide text-gray-900 mb-2">
                        REASON:
                    </label>
                    <input 
                        type="text" 
                        id="reason" 
                        name="reason" 
                        placeholder="Enter the theme of one of your body paragraphs..."
                        class="w-full border-2 border-gray-800 px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-white"
                    >
                </div>

                <div class="pt-4 flex justify-center">
                    <button 
                        type="submit" 
                        class="brand-green hover:bg-emerald-800 text-white font-bold px-8 py-3.5 border-2 border-gray-900 shadow-md tracking-wider transition flex items-center space-x-2"
                    >
                        <span>SEARCH</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </div>
            </form>

            <div id="resultContainer" class="mt-8 hidden border-t-2 border-dashed border-gray-300 pt-6">
                <h3 class="text-sm font-bold text-gray-700 mb-2 uppercase">AI Agent Request Payload:</h3>
                <pre id="outputJson" class="bg-gray-900 text-emerald-400 p-4 text-xs overflow-x-auto rounded"></pre>
                <p class="text-xs text-gray-500 mt-2">✨ (Ready to connect your next results page / backend API)</p>
            </div>

        </div>
    </main>

    <footer class="brand-green text-white py-4 border-t-4 border-amber-400">
        <div class="max-w-5xl mx-auto px-6 text-center text-xs">
            CS 321 Project Deliverable 02 (Evidence Engine)
        </div>
    </footer>

    <script>
        document.getElementById('evidenceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const thesis = document.getElementById('thesis').value;
            const reason = document.getElementById('reason').value;

            const payload = {
                thesis: thesis,
                reason: reason,
                timestamp: new Date().toISOString()
            };

            const resultContainer = document.getElementById('resultContainer');
            const outputJson = document.getElementById('outputJson');
            outputJson.textContent = JSON.stringify(payload, null, 2);
            resultContainer.classList.remove('hidden');

        });
    </script>
</body>
</html>
