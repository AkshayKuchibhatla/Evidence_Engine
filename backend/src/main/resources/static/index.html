<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence Engine - Input Form</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
.brand-green {
	background-color: #005239;
}

.brand-green-text {
	color: #006633;
}

.accent-gold-bar {
	background-color: #FFCC33;
}
</style>
</head>
<body
	class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

	<header class="brand-green text-white shadow-md">
		<div
			class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
			<div class="flex items-center space-x-4">
				<svg class="w-6 h-6 cursor-pointer" fill="none"
					stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round"
						d="M4 6h16M4 12h16M4 18h16"></path></svg>
				<span class="font-semibold tracking-wide">Evidence Engine</span>
			</div>
			<svg class="w-6 h-6 cursor-pointer" fill="none" stroke="currentColor"
				stroke-width="2" viewBox="0 0 24 24">
				<path stroke-linecap="round" stroke-linejoin="round"
					d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
		</div>
	</header>

	<main class="flex-grow flex items-center justify-center px-4 py-12">
		<div
			class="bg-white border-2 border-gray-800 w-full max-w-2xl shadow-xl rounded-sm p-8 md:p-12 relative">

			<div
				class="flex items-center space-x-3 border-b-2 border-gray-800 pb-4 mb-8">
				<div class="w-2.5 h-8 accent-gold-bar"></div>
				<h1
					class="text-2xl md:text-3xl font-black uppercase tracking-wider brand-green-text">Evidence
					Engine</h1>
			</div>

			<div class="flex justify-end mb-4">
				</button>
			</div>

			<form id="evidenceForm" class="space-y-6">
				<div>
					<label for="thesis"
						class="block text-sm font-bold uppercase tracking-wide text-gray-900 mb-2">
						THESIS: </label> <input type="text" id="thesis" name="thesis"
						placeholder="Enter your paper's main thesis..."
						class="w-full border-2 border-gray-800 px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-white">
				</div>

				<div>
					<label for="reason"
						class="block text-sm font-bold uppercase tracking-wide text-gray-900 mb-2">
						REASON: </label> <input type="text" id="reason" name="reason"
						placeholder="Enter the theme of one of your body paragraphs..."
						class="w-full border-2 border-gray-800 px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-white">
				</div>

				<div class="pt-4 flex justify-center">
					<button type="submit" id="searchButton"
						class="brand-green hover:bg-emerald-800 text-white font-bold px-8 py-3.5 border-2 border-gray-900 shadow-md tracking-wider transition flex items-center space-x-2 disabled:opacity-60 disabled:cursor-wait">
						<span id="searchButtonText">SEARCH</span>
						<!-- magnifying glass (normal) -->
						<svg id="searchIcon" class="w-5 h-5" fill="none"
							stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
					        <path stroke-linecap="round" stroke-linejoin="round"
								d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
					    </svg>
						<!-- spinner (while loading) -->
						<svg id="loadingIcon" class="hidden w-5 h-5 animate-spin"
							fill="none" viewBox="0 0 24 24">
					        <circle class="opacity-25" cx="12" cy="12" r="10"
								stroke="currentColor" stroke-width="4"></circle>
					        <path class="opacity-75" fill="currentColor"
								d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
					    </svg>
					</button>
				</div>
			</form>

			<p id="searchStatus"
				class="hidden mt-6 text-center text-sm font-semibold text-gray-700"
				aria-live="polite"></p>

			<!--<div id="resultContainer"
				class="mt-8 hidden border-t-2 border-dashed border-gray-300 pt-6">
				<h3 class="text-sm font-bold text-gray-700 mb-2 uppercase">AI
					Agent Request Payload:</h3>
				<pre id="outputJson"
					class="bg-gray-900 text-emerald-400 p-4 text-xs overflow-x-auto rounded"></pre>
				<p class="text-xs text-gray-500 mt-2">✨ (Ready to connect your
					next results page / backend API)</p>
			</div>-->

			<div id="sourcesList" class="mt-8 space-y-4"></div>

		</div>
	</main>

	<footer class="brand-green text-white py-4 border-t-4 border-amber-400">
		<div class="max-w-5xl mx-auto px-6 text-center text-xs">Evidence
			Engine</div>
	</footer>

	<script>
		function renderSources(data) {
			const list = document.getElementById('sourcesList');
			list.innerHTML = '';

			if (data.status === 'FAILED') {
				list.textContent = 'Search failed: ' + data.error;
				return;
			}
			if (!data.sources || data.sources.length === 0) {
				list.textContent = 'No sources found. Try rewording your reason.';
				return;
			}

			data.sources
					.forEach(function(s, i) {
						const card = document.createElement('article');
						card.className = 'border-2 border-gray-800 bg-white p-5 shadow-sm';

						const title = document.createElement('a');
						title.href = s.link;
						title.target = '_blank';
						title.rel = 'noopener';
						title.className = 'text-lg font-bold text-emerald-800 hover:underline';
						title.textContent = (i + 1) + '. ' + s.title;

						const meta = document.createElement('p');
						meta.className = 'mt-1 text-sm text-gray-600';
						meta.textContent = [ s.authors, s.journal, s.year ]
								.filter(Boolean).join(' · ');

						card.append(title, meta);

						if (s.abstractText) {
							const details = document.createElement('details');
							details.className = 'mt-3';
							const summary = document.createElement('summary');
							summary.className = 'cursor-pointer text-sm font-bold uppercase tracking-wide text-gray-800';
							summary.textContent = 'Abstract';
							const text = document.createElement('p');
							text.className = 'mt-2 whitespace-pre-line text-sm text-gray-800';
							text.textContent = s.abstractText;
							details.append(summary, text);
							card.append(details);
						}

						if (s.doi) {
							const doi = document.createElement('p');
							doi.className = 'mt-2 text-xs text-gray-500';
							doi.textContent = 'DOI: ' + s.doi;
							card.append(doi);
						}

						list.append(card);
					});
		}

		const button = document.getElementById('searchButton');
		const buttonText = document.getElementById('searchButtonText');
		const searchIcon = document.getElementById('searchIcon');
		const loadingIcon = document.getElementById('loadingIcon');
		const statusLine = document.getElementById('searchStatus');
		const sourcesList = document.getElementById('sourcesList');

		let statusTimers = [];

		function setLoading(isLoading) {
		    button.disabled = isLoading;
		    buttonText.textContent = isLoading ? 'SEARCHING…' : 'SEARCH';
		    searchIcon.classList.toggle('hidden', isLoading);
		    loadingIcon.classList.toggle('hidden', !isLoading);

		    statusTimers.forEach(clearTimeout);
		    statusTimers = [];

		    if (isLoading) {
		        showStatus('Turning your thesis and reason into search terms…');
		        // Timed guesses at what the server is doing (it sends no progress updates yet)
		        statusTimers.push(setTimeout(() => showStatus('Searching the GMU library…'), 2500));
		        statusTimers.push(setTimeout(() => showStatus('Still working, almost there…'), 8000));
		    } else {
		        statusLine.classList.add('hidden');
		    }
		}

		function showStatus(message) {
		    statusLine.textContent = message;
		    statusLine.classList.remove('hidden');
		}

		document.getElementById('evidenceForm').addEventListener('submit', function (e) {
		    e.preventDefault();

		    const payload = {
		        thesis: document.getElementById('thesis').value,
		        reason: document.getElementById('reason').value
		    };

		    sourcesList.innerHTML = '';   // clear old results right away
		    setLoading(true);

		    const xhr = new XMLHttpRequest();
		    xhr.open('POST', '/api/search');
		    xhr.setRequestHeader('Content-Type', 'application/json');

		    // Runs when the server replies (any status code)
		    xhr.onload = function () {
		        if (xhr.status >= 200 && xhr.status < 300) {
		            renderSources(JSON.parse(xhr.responseText));
		        } else if (xhr.status === 400) {
		            sourcesList.textContent = 'Please fill in both the thesis and the reason.';
		        } else {
		            sourcesList.textContent = 'Something went wrong (error ' + xhr.status + '). Please try again.';
		        }
		    };

		    // Runs only if the server can't be reached at all
		    xhr.onerror = function () {
		        sourcesList.textContent = 'Could not reach the server. Is it running?';
		    };

		    // Runs after onload OR onerror, so the button always comes back
		    xhr.onloadend = function () {
		        setLoading(false);
		    };

		    xhr.send(JSON.stringify(payload));
		});
	</script>
</body>
</html>
